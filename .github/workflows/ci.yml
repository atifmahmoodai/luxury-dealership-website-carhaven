name: CarHaven verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: carhaven
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:ci-only-password@localhost:5432/carhaven
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: pip install -r requirements.txt
      - run: python manage.py collectstatic --noinput
      - run: python manage.py makemigrations --check --dry-run && python manage.py test inventory
      - name: Production configuration checks
        env:
          ENVIRONMENT: production
          CLIENT_APPROVED: '1'
          SECRET_KEY: 'ci-only-not-production-secret-abcdefghijklmnopqrstuvwxyz-123456789'
          SITE_ORIGIN: https://dealer.example.test
          CONTACT_EMAIL: qa@example.test
          CONTACT_PHONE: '+15550102020'
          ADDRESS: Fictional test address
          COMPANY_ABOUT: Fictional test company description
        run: python manage.py check --deploy --fail-level WARNING
      - run: npm install --prefix /tmp/browser playwright@1.56.0 && /tmp/browser/node_modules/.bin/playwright install --with-deps chromium
      - run: NODE_PATH=/tmp/browser/node_modules node scripts/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: carhaven-browser-evidence, path: evidence, retention-days: 14}
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t carhaven:ci .
